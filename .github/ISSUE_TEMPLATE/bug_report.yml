name: Bug report
description: Report a reproducible fluoh CLI problem.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a fluoh issue. Please include enough detail for maintainers to reproduce the behavior without reading local machine state.
  - type: input
    id: version
    attributes:
      label: fluoh version
      description: Run `fluoh --version` and paste the first line.
      placeholder: fluoh 0.1.0 - CLI for Flutter OHOS SDKs and package workflows
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command that failed.
      placeholder: fluoh sdk use 3.35
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run `fluoh doctor -p` from the affected project when possible, or `fluoh doctor` outside a project, and paste the full output.
      render: text
      placeholder: |
        [✓] fluoh (...)
            • Dart version ...

        [✓] Sources
            • flutteroh: ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the minimal steps needed to trigger the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant CLI output, errors, or generated file snippets.
      render: text
    validations:
      required: true
  - type: textarea
    id: json_output
    attributes:
      label: JSON output
      description: If the command supports `--json`, rerun with `--json` and paste the exact output. It should be one JSON object with `schema`, `command`, `ok`, and `exitCode`.
      render: json
      placeholder: |
        {
          "schema": "...",
          "command": "...",
          "ok": false,
          "exitCode": 1
        }
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Add any environment details that are not visible in the doctor output.
      placeholder: |
        FlutterOH SDK:
        FLUOH_HOME override:
        Private source or mirror notes:
    validations:
      required: false
  - type: textarea
    id: local_state
    attributes:
      label: Local state and changed files
      description: Note local changes before and after the command, especially changed pubspec, fluoh.yaml, source indexes, SDK cache, or package repository state.
      placeholder: |
        Changed files before command:
        Changed files after failure:
        FLUOH_HOME:
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, repository details, or notes about local changes if relevant.
