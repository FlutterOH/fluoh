name: Bug report
description: Report a reproducible fluoh CLI problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a fluoh issue. Fill in the fields that let maintainers reproduce the problem and distinguish command output from local machine state.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Choose the closest fluoh area.
      options:
        - sdk
        - source
        - project
        - deps
        - package
        - workflow
        - devices
        - schema
        - platform
        - doctor
        - upgrade
        - skill
        - release
        - ci
        - docs
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fluoh version
      description: Run `fluoh --version` and paste the first line.
      placeholder: fluoh 0.1.0 - CLI for FlutterOH SDKs, projects, and package adaptation workflows
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or workflow
      description: Paste the exact command that failed, or describe the workflow if no single command applies.
      placeholder: fluoh package create https://github.com/upstream/package.git --package-path packages/example
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the minimal steps needed to trigger the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the relevant CLI output, errors, generated file snippets, or Git state.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run `fluoh doctor -p` from the affected project when possible, or `fluoh doctor` outside a project, and paste the full output.
      render: text
      placeholder: |
        [✓] fluoh (...)
            • Dart version ...

        [✓] Sources
            • flutteroh: ...
    validations:
      required: true
  - type: textarea
    id: json_output
    attributes:
      label: JSON output
      description: If the command supports `--json`, rerun with `--json` and paste the exact output. It should be one JSON object with `schema`, `command`, `ok`, and `exitCode`.
      render: json
      placeholder: |
        {
          "schema": 1,
          "command": "...",
          "ok": false,
          "exitCode": 1
        }
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Add details that are not visible in doctor output.
      placeholder: |
        FlutterOH SDK:
        Dart or Flutter source:
        FLUOH_HOME override:
        Private source or mirror notes:
    validations:
      required: false
  - type: textarea
    id: local_state
    attributes:
      label: Local state and changed files
      description: Note local changes before and after the command, especially changed pubspec, fluoh.yaml, source indexes, SDK cache, or package repository state.
      placeholder: |
        Changed files before command:
        Changed files after failure:
        Git branch or package branch:
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, repository details, or notes that help explain the issue.
    validations:
      required: false
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I have removed or redacted credentials, tokens, private repository URLs, and irrelevant machine-specific paths.
          required: true
