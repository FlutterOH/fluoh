<svg width="900" height="324" viewBox="0 0 900 324" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">fluoh AI 适配对话</title>
  <desc id="desc">用户用一句中文提示让 AI agent 使用 fluoh，随后 fluoh 安装工具、识别项目、固定 SDK、替换依赖、验证构建并保存报告。</desc>
  <defs>
    <filter id="searchShadow" x="101" y="119" width="698" height="102" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="chipShadow" x="113" y="237" width="674" height="47" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="searchFill" x1="121" y1="132" x2="779" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <style>
      .ui { font-family: "PingFang SC", "Microsoft YaHei", Inter, Arial, sans-serif; letter-spacing: 0; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace; letter-spacing: 0; }
      .caret { animation: blink 1.2s steps(1) infinite; }
      .send { animation: sendPulse 2.8s ease-in-out infinite; transform-origin: 740px 171px; }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
      @keyframes sendPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        .caret, .send { animation: none; }
      }
    </style>
  </defs>

  <rect width="900" height="324" rx="22" fill="#F8FAFC"/>
  <text x="450" y="79" text-anchor="middle" class="ui" fill="#0F172A" font-size="30" font-weight="900">告诉 AI 目标，fluoh 负责执行。</text>
  <text x="450" y="106" text-anchor="middle" class="ui" fill="#64748B" font-size="14">App 和 Package 都走同一套可验证命令链路。</text>

  <g filter="url(#searchShadow)">
    <rect x="121" y="132" width="658" height="78" rx="39" fill="url(#searchFill)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="162" y="177" class="mono" fill="#1E293B" font-size="17">用 $fluoh 让当前 Flutter 项目支持 OHOS。</text>
    <rect class="caret" x="558" y="159" width="3" height="24" rx="1.5" fill="#2563EB"/>
    <g class="send">
      <circle cx="740" cy="171" r="24" fill="#2563EB"/>
      <path d="M740 180V162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M732 171L740 162L748 171" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g filter="url(#chipShadow)">
    <rect x="121" y="244" width="93" height="30" rx="15" fill="#ECFEFF"/>
    <text x="167.5" y="263" text-anchor="middle" class="ui" fill="#0F766E" font-size="11" font-weight="800">安装工具</text>

    <rect x="229" y="244" width="100" height="30" rx="15" fill="#EFF6FF"/>
    <text x="279" y="263" text-anchor="middle" class="ui" fill="#1D4ED8" font-size="11" font-weight="800">识别项目</text>

    <rect x="345" y="244" width="90" height="30" rx="15" fill="#FFFBEB"/>
    <text x="390" y="263" text-anchor="middle" class="ui" fill="#B45309" font-size="11" font-weight="800">固定 SDK</text>

    <rect x="450" y="244" width="93" height="30" rx="15" fill="#F3E8FF"/>
    <text x="496.5" y="263" text-anchor="middle" class="ui" fill="#7C3AED" font-size="11" font-weight="800">替换依赖</text>

    <rect x="559" y="244" width="90" height="30" rx="15" fill="#FFF1F2"/>
    <text x="604" y="263" text-anchor="middle" class="ui" fill="#BE123C" font-size="11" font-weight="800">构建运行</text>

    <rect x="664" y="244" width="115" height="30" rx="15" fill="#F0FDF4"/>
    <text x="721.5" y="263" text-anchor="middle" class="ui" fill="#15803D" font-size="11" font-weight="800">保存报告</text>
  </g>
</svg>
