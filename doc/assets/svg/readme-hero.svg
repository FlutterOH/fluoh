<svg width="900" height="324" viewBox="0 0 900 324" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">fluoh AI support prompt</title>
  <desc id="desc">A short prompt asks an AI agent to use fluoh, then fluoh installs tools, detects the workspace, pins the SDK, fixes dependencies, verifies the build, and saves a report.</desc>
  <defs>
    <linearGradient id="searchFill" x1="121" y1="132" x2="779" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <style>
      .ui { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .mono { font-family: Menlo, Consolas, monospace; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="900" height="324" rx="22" fill="#F8FAFC"/>
  <text x="450" y="79" text-anchor="middle" class="ui" fill="#0F172A" font-size="30" font-weight="900">Tell AI the goal. fluoh runs the workflow.</text>
  <text x="450" y="106" text-anchor="middle" class="ui" fill="#64748B" font-size="14">Apps and packages follow one verified command path.</text>

  <g>
    <rect x="121" y="132" width="658" height="78" rx="39" fill="url(#searchFill)" stroke="#CBD5E1" stroke-width="2"/>
    <text x="162" y="177" class="mono" fill="#1E293B" font-size="16">Use $fluoh to add FlutterOH support to this project.</text>
    <g>
      <circle cx="740" cy="171" r="24" fill="#2563EB"/>
      <path d="M740 180V162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M732 171L740 162L748 171" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g>
    <rect x="121" y="244" width="93" height="30" rx="15" fill="#ECFEFF"/>
    <text x="167.5" y="263" text-anchor="middle" class="ui" fill="#0F766E" font-size="11" font-weight="800">install</text>

    <rect x="229" y="244" width="100" height="30" rx="15" fill="#EFF6FF"/>
    <text x="279" y="263" text-anchor="middle" class="ui" fill="#1D4ED8" font-size="11" font-weight="800">detect project</text>

    <rect x="345" y="244" width="90" height="30" rx="15" fill="#FFFBEB"/>
    <text x="390" y="263" text-anchor="middle" class="ui" fill="#B45309" font-size="11" font-weight="800">pin SDK</text>

    <rect x="450" y="244" width="93" height="30" rx="15" fill="#F3E8FF"/>
    <text x="496.5" y="263" text-anchor="middle" class="ui" fill="#7C3AED" font-size="11" font-weight="800">fix deps</text>

    <rect x="559" y="244" width="90" height="30" rx="15" fill="#FFF1F2"/>
    <text x="604" y="263" text-anchor="middle" class="ui" fill="#BE123C" font-size="11" font-weight="800">build/run</text>

    <rect x="664" y="244" width="115" height="30" rx="15" fill="#F0FDF4"/>
    <text x="721.5" y="263" text-anchor="middle" class="ui" fill="#15803D" font-size="11" font-weight="800">save report</text>
  </g>
</svg>
